<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Article | Empire Moorish</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Redirecting to article...</h1>
        <p id="redirectMessage">Please wait while we open the requested article.</p>
        <p><a href="index.html">Return to Home</a></p>
    </main>

    <script src="articles.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        const article = ARTICLES.find(item => item.id === id);

        if (article) {
            window.location.replace(
                `articles/${encodeURIComponent(article.id)}.html`
            );
        } else {
            document.getElementById("redirectMessage").textContent =
                "Article not found. Please return to the homepage.";
        }
    </script>
</body>
</html>
