<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | Empire Moorish</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>EMPIRE MOORISH</h1>
        <p>Moroccan History, Imperial Dynasties & Architectural Heritage</p>
    </header>

    <nav>
        <a href="index.html">← Back to Home</a>
        <a href="quiz.html">History Quiz</a>
    </nav>

    <main class="container">
        <article class="article-single" id="articleDetail"></article>
    </main>

    <footer>
        <div class="copyright">
            © 2026 Empire Moorish · All Rights Reserved
        </div>
    </footer>

    <script src="articles.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const article = ARTICLES.find(a => a.id === id) || ARTICLES[0];

        document.title = `${article.title} | Empire Moorish`;
        document.getElementById("articleDetail").innerHTML = `
            <span class="cat-tag">${article.category}</span>
            <h1>${article.title}</h1>
            <div class="meta-line">Published on ${article.date}</div>
            <img src="${article.image}" alt="${article.title}">
            <div class="article-body">
                ${article.content.map(paragraph => `<p>${paragraph}</p>`).join("")}
            </div>
            <br>
            <a href="index.html" class="btn-gold">← Explore More Articles</a>
        `;
    </script>
</body>
</html>
