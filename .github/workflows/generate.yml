
name: Generate Articles and Sitemap

on:
  push:
    branches:
      - main
    paths:
      - 'articles.js'
      - 'generate-articles.js'
      - 'generate-sitemap.js'
      - '.github/workflows/generate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate article pages
        run: node generate-articles.js

      - name: Generate sitemap
        run: node generate-sitemap.js

      - name: Save generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/ sitemap.xml
          git diff --cached --quiet || git commit -m "Generate article pages and sitemap"
          git push
